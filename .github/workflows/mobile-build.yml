name: Mobile Builds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:web
      - name: Generate Android native project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build installable APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p mobile-release
          cp android/app/build/outputs/apk/debug/app-debug.apk "mobile-release/KRYPT-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: krypt-android-apk
          path: mobile-release/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:web
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate iOS native project
        run: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Detect Apple signing credentials
        id: signing
        shell: bash
        run: |
          if [[ -n "$IOS_CERTIFICATE_P12_BASE64" && -n "$IOS_CERTIFICATE_PASSWORD" && -n "$IOS_PROVISIONING_PROFILE_BASE64" && -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build unsigned iPhone app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p mobile-release/Payload
          cp -R "$APP_PATH" mobile-release/Payload/
          cat > mobile-release/IOS-SIGNING-REQUIRED.txt <<'TXT'
          This IPA contains a real iPhoneOS KRYPT build but is not Apple-signed.
          Stock iPhones require a valid Apple certificate and provisioning profile.
          Configure the documented GitHub Actions signing secrets to make CI also export a signed IPA.
          TXT
          cd mobile-release
          zip -qry "KRYPT-${VERSION}-ios-unsigned.ipa" Payload
          rm -rf Payload
      - name: Install Apple signing assets
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "krypt-certificate.p12").write_bytes(
              base64.b64decode(os.environ["IOS_CERTIFICATE_P12_BASE64"])
          )
          pathlib.Path(os.environ["RUNNER_TEMP"], "krypt.mobileprovision").write_bytes(
              base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE_BASE64"])
          )
          pathlib.Path(os.environ["RUNNER_TEMP"], "ExportOptions.plist").write_bytes(
              base64.b64decode(os.environ["IOS_EXPORT_OPTIONS_PLIST_BASE64"])
          )
          PY

          KEYCHAIN_PATH="$RUNNER_TEMP/krypt-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/krypt-certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$RUNNER_TEMP/krypt.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          CODE_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n '1s/.*"\(.*\)"/\1/p')

          test -n "$PROFILE_UUID"
          test -n "$PROFILE_NAME"
          test -n "$TEAM_ID"
          test -n "$CODE_SIGN_IDENTITY"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/krypt.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KRYPT_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Archive signed iPhone app
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/KRYPT.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            archive
      - name: Export signed IPA
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          rm -rf ios/export
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/KRYPT.xcarchive \
            -exportPath ios/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find ios/export -maxdepth 2 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          cp "$IPA_PATH" "mobile-release/KRYPT-${VERSION}-ios-signed.ipa"
          rm -f mobile-release/IOS-SIGNING-REQUIRED.txt
      - name: Clean up Apple signing keychain
        if: always() && steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          if [[ -n "${KRYPT_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KRYPT_KEYCHAIN_PATH" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: krypt-ios-ipa
          path: |
            mobile-release/*.ipa
            mobile-release/IOS-SIGNING-REQUIRED.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: mobile-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mobile-artifacts/**/*.apk
            mobile-artifacts/**/*.ipa
            mobile-artifacts/**/IOS-SIGNING-REQUIRED.txt
