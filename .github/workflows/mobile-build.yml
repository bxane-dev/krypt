name: Mobile Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:web
      - name: Generate Android native project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p mobile-release
          cp android/app/build/outputs/apk/debug/app-debug.apk "mobile-release/KRYPT-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: krypt-android-apk
          path: mobile-release/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:web
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate iOS native project
        run: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Build unsigned iPhone app
        run: |
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination "generic/platform=iOS"             -derivedDataPath ios/build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build
      - name: Package unsigned IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p mobile-release/Payload
          cp -R "$APP_PATH" mobile-release/Payload/
          cat > mobile-release/IOS-SIGNING-REQUIRED.txt <<'TXT'
          This IPA contains a real iPhoneOS KRYPT build but is not Apple-signed.
          Stock iPhones require an Apple Development/Distribution certificate and provisioning profile.
          The repository is signing-ready; add Apple signing credentials before distributing to devices or App Store/TestFlight.
          TXT
          cd mobile-release
          zip -qry "KRYPT-${VERSION}-ios-unsigned.ipa" Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: krypt-ios-unsigned-ipa
          path: |
            mobile-release/*.ipa
            mobile-release/IOS-SIGNING-REQUIRED.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: mobile-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mobile-artifacts/**/*.apk
            mobile-artifacts/**/*.ipa
            mobile-artifacts/**/IOS-SIGNING-REQUIRED.txt
