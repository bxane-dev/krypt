name: Unified Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/unified-v0.6.0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_needed: ${{ steps.meta.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:web
      - name: Generate Android native project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p release-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-mobile/KRYPT-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-mobile/*
          if-no-files-found: error

  ios:
    name: iOS IPA
    needs: prepare
    if: needs.prepare.outputs.build_needed == 'true'
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:web
      - name: Generate iOS native project
        run: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Detect Apple signing credentials
        id: signing
        shell: bash
        run: |
          if [[ -n "$IOS_CERTIFICATE_P12_BASE64" && -n "$IOS_CERTIFICATE_PASSWORD" && -n "$IOS_PROVISIONING_PROFILE_BASE64" && -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build unsigned iPhone app
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p release-mobile/Payload
          cp -R "$APP_PATH" release-mobile/Payload/
          cat > release-mobile/IOS-SIGNING-REQUIRED.txt <<'TXT'
          This KRYPT IPA is an unsigned iPhoneOS build.
          A stock iPhone requires a valid Apple certificate and provisioning profile.
          Add the signing secrets documented in docs/ios-signing.md to make CI also export a signed IPA.
          TXT
          cd release-mobile
          zip -qry "KRYPT-${VERSION}-ios-unsigned.ipa" Payload
          rm -rf Payload
      - name: Install Apple signing assets
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          root.joinpath("krypt-certificate.p12").write_bytes(base64.b64decode(os.environ["IOS_CERTIFICATE_P12_BASE64"]))
          root.joinpath("krypt.mobileprovision").write_bytes(base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE_BASE64"]))
          root.joinpath("ExportOptions.plist").write_bytes(base64.b64decode(os.environ["IOS_EXPORT_OPTIONS_PLIST_BASE64"]))
          PY

          KEYCHAIN_PATH="$RUNNER_TEMP/krypt-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/krypt-certificate.p12" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$RUNNER_TEMP/krypt.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          CODE_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n '1s/.*"\(.*\)"/\1/p')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/krypt.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KRYPT_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Archive signed iPhone app
        if: steps.signing.outputs.available == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/KRYPT.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            archive
      - name: Export signed IPA
        if: steps.signing.outputs.available == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          rm -rf ios/export
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/KRYPT.xcarchive \
            -exportPath ios/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find ios/export -maxdepth 2 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          cp "$IPA_PATH" "release-mobile/KRYPT-${VERSION}-ios-signed.ipa"
          rm -f release-mobile/IOS-SIGNING-REQUIRED.txt
      - name: Clean up Apple signing keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          if [[ -n "${KRYPT_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KRYPT_KEYCHAIN_PATH" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-mobile/*
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.build_needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run desktop:win
            artifact: release-windows
            paths: |
              release/*.exe
          - name: Linux x64
            os: ubuntu-latest
            command: npm run desktop:linux
            artifact: release-linux
            paths: |
              release/*.AppImage
              release/*.deb
          - name: macOS Intel
            os: macos-15-intel
            command: npm run desktop:mac:x64
            artifact: release-macos-x64
            paths: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, android, ios, desktop]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add changelog asset
        run: cp CHANGELOG.md release-assets/CHANGELOG.md
      - name: Publish release and assets
        run: |
          TAG="v$VERSION"
          NOTES="docs/releases/v$VERSION.md"
          test -f "$NOTES"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KRYPT v$VERSION" \
              --notes-file "$NOTES"
          fi

          find release-assets -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
      - name: Verify release contents
        run: |
          TAG="v$VERSION"
          ASSET_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets | length')
          echo "Published $ASSET_COUNT release assets."
          test "$ASSET_COUNT" -ge 8
